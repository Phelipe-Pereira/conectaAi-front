<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #333; }
      .actor { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .usecase { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .note { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
      .arrow { stroke: #0066CC; stroke-width: 2; fill: none; }
      .include { stroke-dasharray: 5,5; }
      .extend { stroke-dasharray: 10,5; }
    </style>
  </defs>
  
  <!-- Título -->
  <text x="600" y="30" text-anchor="middle" class="title">Diagrama de Casos de Uso - Middleware Multigateways de Pagamento</text>
  
  <!-- Sistema -->
  <rect x="200" y="80" width="800" height="600" rx="10" fill="#F0F8FF" stroke="#0066CC" stroke-width="2"/>
  <text x="600" y="110" text-anchor="middle" class="title">Middleware Multigateways de Pagamento</text>
  
  <!-- Atores -->
  <!-- Sistema Cliente -->
  <circle cx="100" cy="200" r="30" fill="#0066CC" stroke="#004499" stroke-width="2"/>
  <text x="100" y="250" text-anchor="middle" class="actor">Sistema Cliente</text>
  
  <!-- Administrador do Sistema -->
  <circle cx="100" cy="400" r="30" fill="#FF6600" stroke="#CC5200" stroke-width="2"/>
  <text x="100" y="450" text-anchor="middle" class="actor">Administrador do Sistema</text>
  
  <!-- Gateway de Pagamento -->
  <circle cx="100" cy="600" r="30" fill="#00CC66" stroke="#00994D" stroke-width="2"/>
  <text x="100" y="650" text-anchor="middle" class="actor">Gateway de Pagamento</text>
  
  <!-- Casos de Uso - Sistema Cliente -->
  <ellipse cx="300" cy="150" rx="80" ry="25" fill="#E8F4FD" stroke="#0066CC" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" class="usecase">Enviar requisição de pagamento</text>
  
  <ellipse cx="500" cy="150" rx="80" ry="25" fill="#E8F4FD" stroke="#0066CC" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" class="usecase">Consultar status da transação</text>
  
  <ellipse cx="700" cy="150" rx="80" ry="25" fill="#E8F4FD" stroke="#0066CC" stroke-width="2"/>
  <text x="700" y="155" text-anchor="middle" class="usecase">Receber resposta padronizada</text>
  
  <ellipse cx="900" cy="150" rx="80" ry="25" fill="#E8F4FD" stroke="#0066CC" stroke-width="2"/>
  <text x="900" y="155" text-anchor="middle" class="usecase">Receber fallback automático</text>
  
  <!-- Casos de Uso - Administrador -->
  <ellipse cx="300" cy="250" rx="80" ry="25" fill="#E8F4FD" stroke="#FF6600" stroke-width="2"/>
  <text x="300" y="255" text-anchor="middle" class="usecase">Cadastrar novo gateway</text>
  
  <ellipse cx="500" cy="250" rx="80" ry="25" fill="#E8F4FD" stroke="#FF6600" stroke-width="2"/>
  <text x="500" y="255" text-anchor="middle" class="usecase">Definir regras de prioridade</text>
  
  <ellipse cx="700" cy="250" rx="80" ry="25" fill="#E8F4FD" stroke="#FF6600" stroke-width="2"/>
  <text x="700" y="255" text-anchor="middle" class="usecase">Visualizar logs e histórico</text>
  
  <ellipse cx="900" cy="250" rx="80" ry="25" fill="#E8F4FD" stroke="#FF6600" stroke-width="2"/>
  <text x="900" y="255" text-anchor="middle" class="usecase">Configurar ambiente sandbox</text>
  
  <!-- Casos de Uso - Gateway -->
  <ellipse cx="300" cy="350" rx="80" ry="25" fill="#E8F4FD" stroke="#00CC66" stroke-width="2"/>
  <text x="300" y="355" text-anchor="middle" class="usecase">Receber requisição formatada</text>
  
  <ellipse cx="500" cy="350" rx="80" ry="25" fill="#E8F4FD" stroke="#00CC66" stroke-width="2"/>
  <text x="500" y="355" text-anchor="middle" class="usecase">Retornar status de pagamento</text>
  
  <ellipse cx="700" cy="350" rx="80" ry="25" fill="#E8F4FD" stroke="#00CC66" stroke-width="2"/>
  <text x="700" y="355" text-anchor="middle" class="usecase">Simular falha para fallback</text>
  
  <!-- Setas - Sistema Cliente -->
  <line x1="130" y1="200" x2="220" y2="150" class="arrow"/>
  <line x1="130" y1="200" x2="420" y2="150" class="arrow"/>
  
  <!-- Setas - Administrador -->
  <line x1="130" y1="400" x2="220" y2="250" class="arrow"/>
  <line x1="130" y1="400" x2="420" y2="250" class="arrow"/>
  <line x1="130" y1="400" x2="620" y2="250" class="arrow"/>
  <line x1="130" y1="400" x2="820" y2="250" class="arrow"/>
  
  <!-- Setas - Gateway -->
  <line x1="130" y1="600" x2="220" y2="350" class="arrow"/>
  <line x1="130" y1="600" x2="420" y2="350" class="arrow"/>
  <line x1="130" y1="600" x2="620" y2="350" class="arrow"/>
  
  <!-- Notas -->
  <rect x="50" y="500" width="200" height="120" fill="#FFFFCC" stroke="#FFCC00" stroke-width="1"/>
  <text x="60" y="520" class="note">Observações Técnicas:</text>
  <text x="60" y="535" class="note">- Ambiente sandbox apenas</text>
  <text x="60" y="550" class="note">- Sem dados sensíveis</text>
  <text x="60" y="565" class="note">- Requisições normalizadas</text>
  <text x="60" y="580" class="note">- Logs mantidos</text>
  
  <rect x="950" y="500" width="200" height="120" fill="#FFFFCC" stroke="#FFCC00" stroke-width="1"/>
  <text x="960" y="520" class="note">Fallback Automático:</text>
  <text x="960" y="535" class="note">- Gateway principal falha</text>
  <text x="960" y="550" class="note">- Sistema alternativo ativado</text>
  <text x="960" y="565" class="note">- Transparência para cliente</text>
  
  <!-- Legendas -->
  <text x="600" y="720" text-anchor="middle" class="actor">Legenda:</text>
  <line x1="500" y1="730" x2="520" y2="730" class="arrow"/>
  <text x="530" y="735" class="note">Include</text>
  <line x1="600" y1="730" x2="620" y2="730" class="arrow include"/>
  <text x="630" y="735" class="note">Extend</text>
</svg> 